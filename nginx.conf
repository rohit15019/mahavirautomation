server {
    listen 80;
    server_name mahavirautomation.cloud www.mahavirautomation.cloud;

    location / {
        root /var/www/mahavirautomation/front-end/dist;
        try_files $uri $uri/ /index.html;
        
        # Never cache the root or HTML files so users always get the latest React app
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    # Cache static assets (JS, CSS, images) since Vite uses hashed filenames
    location ~* \.(?:css|js|jpg|svg|png|jpeg|ico|gif|woff2?|eot|ttf|otf)$ {
        root /var/www/mahavirautomation/front-end/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}

server {
    listen 80;
    server_name api.mahavirautomation.cloud;

    # Allow large file uploads (up to 50MB)
    client_max_body_size 50M;

    location / {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
