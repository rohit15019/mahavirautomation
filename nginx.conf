server {
    listen 80;
    server_name mahavirautomation.cloud www.mahavirautomation.cloud;

    location / {
        root /var/www/mahavirautomation/front-end/dist;
        try_files $uri $uri/ /index.html;
    }

    # Note: If your Node.js backend also needs to be accessed through Nginx,
    # you might need to add a location block for it here. For example:
    # location /api {
    #     proxy_pass http://localhost:5000;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection 'upgrade';
    #     proxy_set_header Host $host;
    #     proxy_cache_bypass $http_upgrade;
    # }
}
